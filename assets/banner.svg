<svg width="1400" height="500" viewBox="0 0 1400 500"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="background"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">

    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="55%" stop-color="#F4F9FF"/>
    <stop offset="100%" stop-color="#EAF3FF"/>

  </linearGradient>

  <!-- Blue gradient -->
  <linearGradient id="blue"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">

    <stop offset="0%" stop-color="#173B75"/>
    <stop offset="70%" stop-color="#2878D4"/>
    <stop offset="100%" stop-color="#55A8FF"/>

  </linearGradient>

  <!-- Card shadow -->
  <filter id="shadow"
          x="-20%" y="-20%"
          width="140%" height="140%">

    <feDropShadow
      dx="0"
      dy="8"
      stdDeviation="12"
      flood-opacity="0.12"/>

  </filter>

</defs>


